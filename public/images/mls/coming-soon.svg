<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-label="Photograph coming soon">
  <!--
    The placeholder a listing shows before its photographs have mirrored.

    THE DIRECTION (settled, and endorsed by the owner): no house. The panel this replaced was a
    generated gothic mansion — a FAKE PROPERTY standing in for a real one, on a site that is
    otherwise calm and monochrome. A better fake house would have kept that problem. So this is
    a typographic panel in the site's own palette and display face: it cannot be mistaken for
    the actual home, it cannot read as generated, and it is resolution-independent.

    WHAT CHANGED IN ROUND 18, and it was measured rather than preferred. The owner: "photo
    coming soon needs work, keep something minimalistic." Rendered at the crops it actually
    gets — NoPhoto uses object-cover — the previous drawing was breaking:

      · THE HAIRLINE FRAME DIED AT CARD SIZE. Its inset rectangle sat at x=40 of a 1200-wide
        artwork, and a near-square card scales by HEIGHT and throws the sides away. On every
        search card, home tile and square crop you saw only the top and bottom rules — two
        stray lines near the edges, which reads as a rendering fault rather than as a frame.
      · THE APERTURE GLYPH was the loudest thing on the panel at every size, and it is the most
        generic mark in software: every empty state everywhere uses it.
      · THE TYPE COLLAPSED to roughly 10px on a search card, so the one thing this panel exists
        to say was the hardest thing on it to read.

    So the frame and the glyph are GONE — two elements removed, none added — and what fixes the
    rest is structural, not decorative:

      SQUARE viewBox. A 3:2 artwork cropped into a 3:4 tile loses a third of its width; a square
      one is close to every box we ask it to fill, so nothing important leaves the frame.
      Everything here lives inside a safe area of x 150-850, y 200-800, which survives every crop
      the site uses (the 2:1 map popup through the 3:4 portrait tile).

      TWO LINES. Breaking the phrase lets each line be far larger inside the same safe width —
      66px against 52 — so a 300px card renders ~19px of readable type instead of ~10px. It also
      reads as a considered setting rather than as a system message.

    Type never resolves to Newsreader in practice, and that is fine: an SVG loaded through <img>
    is its own document and gets no @font-face from the page, so the Georgia fallback is what
    ships and this is set to Georgia's metrics. Palette is hard-coded for the same reason:
    ink #000, stone #6f6f6f, over the mist wash the cards already sit on.
  -->
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f8fa"/>
      <stop offset="1" stop-color="#e9edf2"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="1000" fill="url(#wash)"/>

  <text text-anchor="middle" font-family="Newsreader, Georgia, 'Times New Roman', serif"
        font-size="66" font-weight="300" letter-spacing="-0.5" fill="#000000">
    <tspan x="500" y="470">Photograph</tspan>
    <tspan x="500" y="548">coming soon</tspan>
  </text>

  <text x="500" y="628" text-anchor="middle"
        font-family="Lato, Helvetica, Arial, sans-serif"
        font-size="23" font-weight="700" letter-spacing="3.6" fill="#6f6f6f">
    REALTYLT
  </text>
</svg>
