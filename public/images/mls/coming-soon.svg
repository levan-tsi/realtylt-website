<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Photograph coming soon">
  <!--
    The placeholder a listing shows before its photographs have mirrored.

    WHAT THIS REPLACES, and why it is not another picture: a raster of a gothic mansion at
    night, under fog and a full moon, with "Coming Soon" in glowing gold script. The owner:
    "we need better coming soon pic, quality is low and in general dont like what we have now."
    Both complaints have the same answer. It was low resolution because it was a 1200px raster
    filling 2x retina cards, and it looked wrong because it was a FAKE HOUSE — a generated
    image pretending to be a property, on a site that is otherwise calm, monochrome and
    restrained. Replacing it with a better fake house would have kept the second problem.

    So there is no house. This is a typographic panel in the site's own palette and display
    face: it cannot look generated, it cannot be mistaken for the actual property, it is
    resolution-independent, and it weighs about 1KB instead of 50. Restraint is the luxury
    signal the rest of the site already runs on.

    Palette and type are the site's own tokens, hard-coded because an SVG served as an <img>
    gets no CSS from the page: ink #000, mist #f3f5f8, stone #6f6f6f, line #dddddd,
    Newsreader for display (with the same Georgia/serif fallback stack globals.css uses).
  -->
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f8fa"/>
      <stop offset="1" stop-color="#eceff4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#wash)"/>

  <!-- A single hairline frame, inset. The same restraint as the site's two-line system. -->
  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#dddddd" stroke-width="2"/>

  <!-- A drawn aperture, not a photograph: the universal "picture" mark, stated quietly.
       Stroked only, so it reads as a diagram rather than as content. -->
  <g transform="translate(600 330)" fill="none" stroke="#9aa3ad" stroke-width="5"
     stroke-linecap="round" stroke-linejoin="round">
    <rect x="-92" y="-70" width="184" height="140" rx="10"/>
    <circle cx="-42" cy="-26" r="17"/>
    <path d="M-92 42 l58 -56 a10 10 0 0 1 14 0 l38 38 l26 -24 a10 10 0 0 1 14 0 l48 46"/>
  </g>

  <text x="600" y="486" text-anchor="middle"
        font-family="Newsreader, Georgia, 'Times New Roman', serif"
        font-size="52" font-weight="300" letter-spacing="-0.5" fill="#000000">
    Photograph coming soon
  </text>

  <text x="600" y="536" text-anchor="middle"
        font-family="Lato, Helvetica, Arial, sans-serif"
        font-size="21" font-weight="700" letter-spacing="3.2" fill="#6f6f6f">
    REALTYLT
  </text>
</svg>
