<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-label="Photograph coming soon">
  <!--
    The CAPTIONLESS cut — used where the surface already says what is going on, or where the
    frame is too small to read a line of type: map popups, gallery thumbnails, and the portrait
    overlay tiles that print their own price and address across the image.

    It is the SAME panel as coming-soon.svg with the words removed rather than a different
    picture, so the two never look like two brands sitting side by side. See that file for why
    the hairline frame and the aperture glyph went away in round 18, and why the artwork is now
    square (both were measured at the crops these are actually asked to fill).

    The wordmark alone is deliberate. At the sizes this cut serves — a 252px popup, a 96px
    thumbnail — a sentence is unreadable and an icon is noise, so what is left is a quiet field
    with one small mark on it, which is what an empty frame ought to look like. It is set a
    little larger and lighter than the captioned panel's wordmark because here it is the only
    thing on the panel rather than a footnote under a headline.
  -->
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f8fa"/>
      <stop offset="1" stop-color="#e9edf2"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="1000" fill="url(#wash)"/>

  <text x="500" y="512" text-anchor="middle"
        font-family="Lato, Helvetica, Arial, sans-serif"
        font-size="30" font-weight="700" letter-spacing="4.6" fill="#8b9099">
    REALTYLT
  </text>
</svg>
